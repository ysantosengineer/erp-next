name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy API and smoke test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_URL }}
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      SMOKE_API_URL: ${{ vars.PRODUCTION_API_URL }}
      SMOKE_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
      EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$RENDER_DEPLOY_HOOK_URL"
          test -n "$SMOKE_API_URL"
          test -n "$SMOKE_WEB_URL"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply production migrations
        run: npm run prisma:migrate:deploy

      - name: Trigger Render deployment
        run: node scripts/trigger-render-deploy.mjs

      - name: Verify production
        run: node scripts/smoke-test.mjs
