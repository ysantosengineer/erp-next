services:
  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_next}:${POSTGRES_PASSWORD:-erp_next_local_only}@postgres:5432/${POSTGRES_DB:-erp_next}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      TRUST_PROXY_HOPS: 0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_compose_access_secret_change_me_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_compose_refresh_secret_change_me_32_chars}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      JWT_ISSUER: ${JWT_ISSUER:-erp-next-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-erp-next-web}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-256kb}
      APP_VERSION: local-container
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_next}
      POSTGRES_USER: ${POSTGRES_USER:-erp_next}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_next_local_only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
